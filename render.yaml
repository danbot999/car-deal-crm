services:
  - type: web
    name: car-deal-crm
    runtime: node
    plan: free
    rootDir: crm
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        value: file:/tmp/car-deal-crm/render.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_RESEARCH_MODEL
        value: gpt-4o-mini
      - key: CRM_INGEST_TOKEN_SHA256
        value: b9e1a9065d25a89a42ab97a38945fa1e021ddb954c24e1902169c8ad00e8bc11
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

    # Free Render web services use an ephemeral filesystem. For durable CRM data,
    # switch plan to starter or above and uncomment this disk.
    # disk:
    #   name: crm-data
    #   mountPath: /var/data
    #   sizeGB: 1
