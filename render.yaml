services:
  - type: web
    name: car-deal-crm
    runtime: node
    plan: free
    rootDir: crm
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        value: file:./prisma/render.db
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_RESEARCH_MODEL
        value: gpt-4o-mini
